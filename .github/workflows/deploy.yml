name: Build & Deploy to GitHub Pages

on:
  # Deploys automatically on every push to master, and can also be run manually.
  push:
    branches: [master]
  workflow_dispatch:

# Publishing the built site as a commit on the gh-pages branch needs repo write access.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # The branch GitHub Pages serves from. Rename it here if you rename the branch.
  PUBLISH_BRANCH: gh-pages

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Angular 22 requires Node ^22.22.3 || ^24.15.0 || >=26.0.0.
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npx ng build --configuration production --base-href /

      # Without this, GitHub reprocesses the published branch with Jekyll, which
      # ignores any file or directory whose name begins with an underscore.
      - name: Disable Jekyll processing
        run: touch frontend/dist/frontend/browser/.nojekyll

      # The branch holds only the built site, one commit deep: each deploy starts a
      # fresh history and force-pushes, so build output never accumulates in the repo.
      - name: Publish to ${{ env.PUBLISH_BRANCH }}
        working-directory: frontend/dist/frontend/browser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -b "$PUBLISH_BRANCH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "Deploy $GITHUB_SHA"
          git push --force \
            "https://x-access-token:$GITHUB_TOKEN@github.com/$GITHUB_REPOSITORY.git" \
            "$PUBLISH_BRANCH"
